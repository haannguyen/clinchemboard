<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABCC Clinical Chemistry Practice Exam 🌸</title>
    
    <!-- 🌸 Google Fonts Import (Fredoka & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 🧮 MathJax for LaTeX Equations -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #f7f3f9;
            --card-bg: #ffffff;
            --text-color: #4a4055;
            --primary-color: #a78bfa; /* Soft Lavender */
            --primary-hover: #8b5cf6;
            --border-color: #f1e8f5;
            
            /* Pastel Option Palette */
            --success-bg: #e6f4ea;
            --success-border: #a3e635;
            --success-text: #2e7d32;
            
            --error-bg: #fde8e8;
            --error-border: #f87171;
            --error-text: #991b1b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e9d5ff 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(167, 139, 250, 0.12);
            border: 2px solid var(--border-color);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed #ede9fe;
            padding-bottom: 18px;
        }

        .header h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            margin: 0;
            color: #7c3aed;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-badge {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            background: #f3e8ff;
            color: #6d28d9;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: inset 0 0 0 1px #e9d5ff;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #372e42;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #faf7fc;
            border: 2px solid #f3e8ff;
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 0.98rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--primary-color);
            background: #f5f3ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(167, 139, 250, 0.15);
        }

        .option-btn.correct {
            background-color: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-text);
        }

        .explanation {
            display: none;
            background: #fffbeb;
            border-left: 5px solid #f59e0b;
            padding: 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.08);
            color: #78350f;
        }

        .next-btn {
            width: 100%;
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            border-radius: 16px;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.25);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.35);
        }

        .results-container {
            text-align: center;
            display: none;
            padding: 20px 10px;
        }

        .results-container h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2rem;
            color: #7c3aed;
            margin-bottom: 10px;
        }

        .results-container p {
            font-size: 1.15rem;
            opacity: 0.85;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="header">
            <h1>Clin Chem Review ✨</h1>
            <div class="score-badge" id="progress">Q 0 / 0</div>
        </div>

        <div class="question-title" id="question-text">Loading question...</div>
        <div class="options-list" id="options-container"></div>
        <div class="explanation" id="explanation-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <div class="results-container" id="results-screen">
        <h2>Quiz Completed! 🎀</h2>
        <p id="final-score">You scored 0 out of 0.</p>
        <button class="next-btn" style="display:block;" onclick="restartQuiz()">Restart Practice Exam 🌸</button>
    </div>
</div>

<script>
    let questions = [];
    let currentQ = 0;
    let score = 0;

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const explanationBox = document.getElementById('explanation-box');
    const nextBtn = document.getElementById('next-btn');
    const progressEl = document.getElementById('progress');

    async function fetchQuestions() {
        try {
            const response = await fetch('./questions.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            questions = await response.json();
            loadQuestion();
        } catch (error) {
            questionText.textContent = "Error loading questions.json. Ensure file exists in the repository root.";
            console.error("Fetch Error:", error);
        }
    }

    function loadQuestion() {
        if (questions.length === 0) return;

        const q = questions[currentQ];
        questionText.innerHTML = `${currentQ + 1}. ${q.question}`;
        progressEl.textContent = `Q ${currentQ + 1} / ${questions.length}`;
        
        optionsContainer.innerHTML = '';
        explanationBox.style.display = 'none';
        nextBtn.style.display = 'none';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            btn.onclick = () => selectOption(idx);
            optionsContainer.appendChild(btn);
        });

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([questionText, optionsContainer]);
        }
    }

    function selectOption(index) {
        const q = questions[currentQ];
        const buttons = optionsContainer.children;

        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
            if (i === q.correct) {
                buttons[i].classList.add('correct');
            } else if (i === index) {
                buttons[i].classList.add('incorrect');
            }
        }

        if (index === q.correct) {
            score++;
        }

        explanationBox.innerHTML = q.explanation;
        explanationBox.style.display = 'block';
        nextBtn.style.display = 'block';

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([explanationBox]);
        }
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        const resultsScreen = document.getElementById('results-screen');
        resultsScreen.style.display = 'block';
        document.getElementById('final-score').textContent = `You scored ${score} out of ${questions.length} (${Math.round((score/questions.length)*100)}%).`;
    }

    function restartQuiz() {
        currentQ = 0;
        score = 0;
        document.getElementById('results-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    fetchQuestions();
</script>
</body>
</html>
