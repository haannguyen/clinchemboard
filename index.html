<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ha An's ABCC Clinical Chemistry Practice Exam 🌸</title>
    
    <!-- 🌸 Google Fonts Import (Fredoka & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 🧮 MathJax for LaTeX Equations -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #f7f3f9;
            --card-bg: #ffffff;
            --text-color: #4a4055;
            --primary-color: #a78bfa; /* Soft Lavender */
            --primary-hover: #8b5cf6;
            --border-color: #f1e8f5;
            
            /* Pastel Option Palette */
            --success-bg: #e6f4ea;
            --success-border: #a3e635;
            --success-text: #2e7d32;
            
            --error-bg: #fde8e8;
            --error-border: #f87171;
            --error-text: #991b1b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e9d5ff 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(167, 139, 250, 0.12);
            border: 2px solid var(--border-color);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed #ede9fe;
            padding-bottom: 18px;
        }

        .header h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            margin: 0;
            color: #7c3aed;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-badge {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            background: #f3e8ff;
            color: #6d28d9;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: inset 0 0 0 1px #e9d5ff;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #372e42;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #faf7fc;
            border: 2px solid #f3e8ff;
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 0.98rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--primary-color);
            background: #f5f3ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(167, 139, 250, 0.15);
        }

        .option-btn.correct {
            background-color: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-text);
        }

        .explanation {
            display: none;
            background: #fffbeb;
            border-left: 5px solid #f59e0b;
            padding: 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.08);
            color: #78350f;
        }

        .next-btn {
            width: 100%;
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            border-radius: 16px;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.25);
            margin-bottom: 10px;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.35);
        }

        .results-container {
            text-align: center;
            display: none;
            padding: 20px 10px;
        }

        .results-container h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2rem;
            color: #7c3aed;
            margin-bottom: 10px;
        }

        .results-container p {
            font-size: 1.15rem;
            opacity: 0.85;
            margin-bottom: 25px;
        }

        /* 🎴 Deck Selection Styles */
        .deck-selection-screen {
            display: none;
            text-align: center;
        }

        .deck-selection-screen h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            color: #7c3aed;
            margin-bottom: 10px;
        }

        .deck-selection-screen p {
            font-size: 1.05rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .deck-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .deck-grid {
                grid-template-columns: 1fr;
            }
        }

        .deck-card {
            background: linear-gradient(135deg, #f5f3ff 0%, #faf7fc 100%);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 24px 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.08);
        }

        .deck-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(167, 139, 250, 0.15);
            background: linear-gradient(135deg, #ede9fe 0%, #f5f3ff 100%);
        }

        .deck-card h3 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            color: #7c3aed;
            margin: 0 0 8px 0;
        }

        .deck-card p {
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.75;
            margin: 0;
        }

        .deck-count {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: 600;
            margin-top: 12px;
        }

        /* 🔢 Batch Size Selection Styles */
        .batch-size-screen {
            display: none;
            text-align: center;
        }

        .batch-size-screen h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            color: #7c3aed;
            margin-bottom: 10px;
        }

        .batch-size-screen p {
            font-size: 1.05rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .batch-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .batch-card {
            background: linear-gradient(135deg, #f5f3ff 0%, #faf7fc 100%);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.08);
        }

        .batch-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(167, 139, 250, 0.15);
            background: linear-gradient(135deg, #ede9fe 0%, #f5f3ff 100%);
        }

        .batch-card h3 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            color: #7c3aed;
            margin: 0 0 8px 0;
        }

        .batch-card p {
            font-size: 0.95rem;
            color: var(--text-color);
            opacity: 0.75;
            margin: 0;
        }

        .back-btn {
            background: #f3e8ff;
            color: #6d28d9;
            box-shadow: none;
        }

        .back-btn:hover {
            background: #ede9fe;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- 🎴 Deck Selection Screen -->
    <div id="deck-selection-screen" class="deck-selection-screen">
        <h1>Clin Chem Review ✨</h1>
        <p>Choose a question deck</p>
        <div class="deck-grid" id="deck-grid"></div>
    </div>

    <!-- 🔢 Batch Size Selection Screen -->
    <div id="batch-size-screen" class="batch-size-screen">
        <h1>Questions Per Set 🎯</h1>
        <p>How many questions would you like per set?</p>
        <div class="batch-grid">
            <div class="batch-card" onclick="startWithBatchSize(20)">
                <h3>20</h3>
                <p>Quick practice</p>
            </div>
            <div class="batch-card" onclick="startWithBatchSize(100)">
                <h3>100</h3>
                <p>Full marathon</p>
            </div>
        </div>
        <button class="next-btn back-btn" style="display:block;" onclick="backToDeckSelection()">Back to Deck Selection 📚</button>
    </div>

    <!-- 📝 Quiz Screen -->
    <div id="quiz-screen">
        <div class="header">
            <h1>Clin Chem Review ✨</h1>
            <div class="score-badge" id="progress">Set 1 | Q 0 / 20</div>
        </div>

        <div class="question-title" id="question-text">Loading practice set...</div>
        <div class="options-list" id="options-container"></div>
        <div class="explanation" id="explanation-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <!-- 🎯 Results Screen -->
    <div class="results-container" id="results-screen">
        <h2 id="results-title">Set Completed! 🎀</h2>
        <p id="final-score">You scored 0 out of 20.</p>
        <button class="next-btn" id="action-btn" style="display:block;" onclick="handleNextBatch()">Next Set ➔</button>
        <button class="next-btn" style="display:block; background:#f3e8ff; color:#6d28d9; box-shadow:none;" onclick="restartExam()">Restart from Set 1 🌸</button>
        <button class="next-btn" style="display:block; background:#f3e8ff; color:#6d28d9; box-shadow:none;" onclick="backToDeckSelection()">Back to Deck Selection 📚</button>
    </div>
</div>

<script>
// 📚 Define available decks
const DECKS = [
    { name: 'Practice Set 1', file: 'questions.json', emoji: '📖' },
    { name: 'Practice Set 2', file: 'abcc_copilot.json', emoji: '📕' },
    { name: 'Practice Set 3', file: 'questions3.json', emoji: '📗' },
    { name: 'Practice Set 4', file: 'questions4.json', emoji: '📘' }
];

let BATCH_SIZE = 20; // Default batch size
let allQuestions = [];
let currentBatch = [];
let batchIndex = 0;
let currentQ = 0;
let score = 0;
let currentDeck = null;

const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const explanationBox = document.getElementById('explanation-box');
const nextBtn = document.getElementById('next-btn');
const progressEl = document.getElementById('progress');
const deckSelectionScreen = document.getElementById('deck-selection-screen');
const batchSizeScreen = document.getElementById('batch-size-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultsScreen = document.getElementById('results-screen');

// 🔀 Fisher-Yates Shuffle Algorithm
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

// Initialize deck selection screen
function initializeDeckSelection() {
    const deckGrid = document.getElementById('deck-grid');
    deckGrid.innerHTML = '';

    DECKS.forEach((deck) => {
        const deckCard = document.createElement('div');
        deckCard.className = 'deck-card';
        deckCard.innerHTML = `
            <h3>${deck.emoji} ${deck.name}</h3>
            <p>Multiple choice questions</p>
            <div class="deck-count">Click to select</div>
        `;
        deckCard.onclick = () => selectDeck(deck);
        deckGrid.appendChild(deckCard);
    });

    deckSelectionScreen.style.display = 'block';
    batchSizeScreen.style.display = 'none';
    quizScreen.style.display = 'none';
    resultsScreen.style.display = 'none';
}

// Select a deck and move to batch size selection
function selectDeck(deck) {
    currentDeck = deck;
    deckSelectionScreen.style.display = 'none';
    batchSizeScreen.style.display = 'block';
    quizScreen.style.display = 'none';
    resultsScreen.style.display = 'none';
}

// Load a specific deck and start with selected batch size
async function loadDeck(batchSize) {
    BATCH_SIZE = batchSize;
    try {
        const response = await fetch(`./${currentDeck.file}?v=` + new Date().getTime());
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        allQuestions = await response.json();
        
        // Randomly shuffle all questions upon loading
        shuffleArray(allQuestions);
        
        batchSizeScreen.style.display = 'none';
        startBatch(0);
    } catch (error) {
        questionText.textContent = `Error loading ${currentDeck.file}. Ensure file exists in the repository root.`;
        console.error("Fetch Error:", error);
        initializeDeckSelection();
    }
}

function startWithBatchSize(batchSize) {
    loadDeck(batchSize);
}

function startBatch(index) {
    batchIndex = index;
    const start = batchIndex * BATCH_SIZE;
    const end = start + BATCH_SIZE;
    currentBatch = allQuestions.slice(start, end);

    if (currentBatch.length === 0) {
        showFinalBankCompletion();
        return;
    }

    currentQ = 0;
    score = 0;
    resultsScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    loadQuestion();
}

function loadQuestion() {
    if (currentBatch.length === 0) return;

    const q = currentBatch[currentQ];
    const overallNumber = (batchIndex * BATCH_SIZE) + currentQ + 1;
    const totalSets = Math.ceil(allQuestions.length / BATCH_SIZE);

    questionText.innerHTML = `${overallNumber}. ${q.question}`;
    progressEl.textContent = `Set ${batchIndex + 1}/${totalSets} | Q ${currentQ + 1}/${currentBatch.length}`;
    
    optionsContainer.innerHTML = '';
    explanationBox.style.display = 'none';
    nextBtn.style.display = 'none';

    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = opt;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
    });

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([questionText, optionsContainer]);
    }
}

function selectOption(index) {
    const q = currentBatch[currentQ];
    const buttons = optionsContainer.children;

    for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === q.correct) {
            buttons[i].classList.add('correct');
        } else if (i === index) {
            buttons[i].classList.add('incorrect');
        }
    }

    if (index === q.correct) {
        score++;
    }

    explanationBox.innerHTML = q.explanation;
    explanationBox.style.display = 'block';
    nextBtn.style.display = 'block';

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([explanationBox]);
    }
}

function nextQuestion() {
    currentQ++;
    if (currentQ < currentBatch.length) {
        loadQuestion();
    } else {
        showBatchResults();
    }
}

function showBatchResults() {
    quizScreen.style.display = 'none';
    resultsScreen.style.display = 'block';
    
    const percent = Math.round((score / currentBatch.length) * 100);
    document.getElementById('results-title').textContent = `Set ${batchIndex + 1} Completed! 🎀`;
    document.getElementById('final-score').textContent = `You scored ${score} out of ${currentBatch.length} (${percent}%).`;

    const actionBtn = document.getElementById('action-btn');
    if ((batchIndex + 1) * BATCH_SIZE < allQuestions.length) {
        actionBtn.textContent = `Start Next Set of ${BATCH_SIZE} ➔`;
        actionBtn.onclick = () => startBatch(batchIndex + 1);
    } else {
        actionBtn.textContent = `Reshuffle & Restart Question Bank 🌸`;
        actionBtn.onclick = () => restartExam();
    }
}

function showFinalBankCompletion() {
    quizScreen.style.display = 'none';
    resultsScreen.style.display = 'block';
    document.getElementById('results-title').textContent = `All Sets Completed! 🌟`;
    document.getElementById('final-score').textContent = `You completed all ${allQuestions.length} questions in the question bank.`;
    
    const actionBtn = document.getElementById('action-btn');
    actionBtn.textContent = `Reshuffle & Restart Exam 🌸`;
    actionBtn.onclick = () => restartExam();
}

function handleNextBatch() {
    startBatch(batchIndex + 1);
}

function restartExam() {
    // Re-shuffle all questions when restarting
    shuffleArray(allQuestions);
    startBatch(0);
}

function backToDeckSelection() {
    initializeDeckSelection();
}

// Start with deck selection screen
initializeDeckSelection();
</script>
</body>
</html>
